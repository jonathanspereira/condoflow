services:

  backend:
    # --- CONFIGURAÇÃO PARA AWS (Docker Hub) ---
    image: jonathanspereira/condoflow-backend:latest
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile
    container_name: condoflow_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?user=postgres.oupexkpckyymcqeiihyu&password=SUA_SENHA_AQUI
      - DB_USER=postgres.oupexkpckyymcqeiihyu
      - DB_PASSWORD=SUA_SENHA_AQUI
      - ADMIN_EMAIL=jonathanpereira.jsp@outlook.com
      - ADMIN_PASSWORD=SEU_ADMIN_PASSWORD
      - API_SECURITY_TOKEN_SECRET=SEU_TOKEN_SECRET
      - CLOUDFLARE_TURNSTILE_SECRET=SEU_TURNSTILE_SECRET
      - APP_FRONTEND_URL=https://www.condoflow.fun
      - RESEND_API_KEY=re_SUA_API_KEY_DO_RESEND
      - RESEND_FROM_EMAIL=noreply@condoflow.fun
      - TZ=America/Sao_Paulo
    # env_file:
    #   - ./backend/.env

  frontend:
    # --- CONFIGURAÇÃO PARA AWS (Docker Hub) ---
    image: jonathanspereira/condoflow-frontend:latest
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile
    container_name: condoflow_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # --- CONFIGURAÇÃO PARA AWS (Substitua pelo IP público da AWS ou domínio) ---
      - NEXT_PUBLIC_API_URL=https://api.condoflow.fun/api/v1

      # --- CONFIGURAÇÃO LOCAL (Descomente para rodar localmente) ---
      # - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAAEjdiZSn29NU4l8Z
      - TZ=America/Sao_Paulo
    depends_on:
      - backend
