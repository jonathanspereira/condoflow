version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: condoflow_postgres
    restart: always
    environment:
      POSTGRES_DB: condoflow_db
      POSTGRES_USER: condoflow_user
      POSTGRES_PASSWORD: condoflow_password
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: condoflow_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/condoflow_db
      - SPRING_DATASOURCE_USERNAME=condoflow_user
      - SPRING_DATASOURCE_PASSWORD=condoflow_password
      - TZ=America/Sao_Paulo
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: condoflow_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - TZ=America/Sao_Paulo
    depends_on:
      - backend

volumes:
  postgres_data: